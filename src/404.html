<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — RubseroIA</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="La página que buscas no existe. Vuelve al inicio de RubseroIA.">
<meta name="theme-color" content="#04060F">
<link rel="canonical" href="https://rubseroIA.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04060F;--g1:#01FFC2;--text:#E8EEFF;--text2:#6B7FAA;--border:rgba(255,255,255,0.07)}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  text-align:center;
  padding:2rem
}
h1{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:clamp(4rem,12vw,10rem);
  font-weight:800;
  letter-spacing:-.04em;
  line-height:1;
  background:linear-gradient(135deg,var(--g1),#00C9FF);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:1rem
}
p{
  color:var(--text2);
  font-size:clamp(1rem,2vw,1.2rem);
  font-weight:300;
  max-width:420px;
  line-height:1.7;
  margin-bottom:2.5rem
}
a{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--g1);
  text-decoration:none;
  font-weight:600;
  font-size:1rem;
  padding:.8rem 2rem;
  border:1px solid rgba(1,255,194,.35);
  border-radius:100px;
  transition:all .25s
}
a:hover{
  background:rgba(1,255,194,.08);
  transform:translateY(-2px)
}
.gridlines{
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(1,255,194,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(1,255,194,.018) 1px,transparent 1px);
  background-size:80px 80px;
  z-index:-1
}
</style>
</head>
<body>
<div class="gridlines"></div>
<h1>404</h1>
<p>Esta página no existe. Pero podemos crearla con IA.</p>
<a href="/">← Volver al inicio</a>
</body>
</html>
