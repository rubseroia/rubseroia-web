<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — RubseroIA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.min.css">
<style>
  .notfound {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .notfound .code {
    font-family: var(--font-mono);
    color: var(--accent);
    font-size: 14px;
    margin-bottom: 16px;
  }
  .notfound h1 { font-size: clamp(32px, 6vw, 48px); margin-bottom: 16px; }
  .notfound p { color: var(--text-muted); margin-bottom: 32px; }
</style>
</head>
<body>
  <div class="notfound">
    <span class="code">ERROR 404</span>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté roto o que la página se haya movido.</p>
    <a href="/" class="btn btn-primary">Volver al inicio</a>
  </div>
</body>
</html>
